
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://picsum.photos/32/32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinNexus | Enterprise Wealth OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--background)',
              surface: 'var(--surface)',
              primary: 'var(--primary)',
              secondary: 'var(--secondary)',
              accent: 'var(--accent)',
              danger: 'var(--danger)',
              text: 'var(--text)',
              muted: 'var(--muted)',
              border: 'var(--border)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/react-datepicker/dist/react-datepicker.css">
    <style>
      :root {
        /* Light Mode Defaults */
        --background: #f4f4f5; /* Zinc 100 */
        --surface: #ffffff;
        --primary: #2563eb;    /* Blue 600 */
        --secondary: #059669;  /* Emerald 600 */
        --accent: #d97706;     /* Amber 600 */
        --danger: #dc2626;     /* Red 600 */
        --text: #18181b;       /* Zinc 900 */
        --muted: #71717a;      /* Zinc 500 */
        --border: #e4e4e7;     /* Zinc 200 */
      }

      .dark {
        /* Dark Mode Defaults */
        --background: #09090b; /* Zinc 950 */
        --surface: #18181b;    /* Zinc 900 */
        --primary: #3b82f6;    /* Blue 500 */
        --secondary: #10b981;  /* Emerald 500 */
        --accent: #f59e0b;     /* Amber 500 */
        --danger: #ef4444;     /* Red 500 */
        --text: #f4f4f5;       /* Zinc 100 */
        --muted: #71717a;      /* Zinc 500 */
        --border: #27272a;     /* Zinc 800 */
      }

      body {
        background-color: var(--background);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }
      /* DatePicker Custom Overrides */
      .react-datepicker-wrapper {
        width: 100%;
      }
      .react-datepicker {
        background-color: var(--surface) !important;
        border-color: var(--border) !important;
        font-family: 'Inter', sans-serif !important;
      }
      .react-datepicker__header {
        background-color: var(--surface) !important;
        border-bottom-color: var(--border) !important;
      }
      .react-datepicker__current-month, .react-datepicker__day-name, .react-datepicker__day {
        color: var(--text) !important;
      }
      .react-datepicker__day:hover {
        background-color: var(--border) !important;
      }
      .react-datepicker__day--selected {
        background-color: var(--primary) !important;
        color: white !important;
      }
      .react-datepicker__input-container input {
        width: 100%;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react-dom": "https://esm.sh/react-dom@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0?external=react,react-dom",
        "recharts": "https://esm.sh/recharts@^3.7.0?external=react,react-dom",
        "gsap": "https://esm.sh/gsap@^3.14.2",
        "gsap/": "https://esm.sh/gsap@^3.14.2/",
        "react-datepicker": "https://esm.sh/react-datepicker@7.6.0?external=react,react-dom",
        "next-themes": "https://esm.sh/next-themes@0.3.0?external=react,react-dom"
      }
    }
    </script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
